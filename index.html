<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BrewOn | Creative Growth Agency</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
font-family:'Poppins',sans-serif;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
}

/* Scrollbar */

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-track{
background:#080808;
}

::-webkit-scrollbar-thumb{
background:#b98b3d;
border-radius:20px;
}

/* LOADER */

#loader{

position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#050505;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:99999;
transition:1s;

}

.logoBox{

position:relative;

}

.logo{

width:170px;
filter:
drop-shadow(0 0 10px rgba(201,149,55,.35))
drop-shadow(0 0 30px rgba(201,149,55,.25));

opacity:0;
animation:fadeLogo 2s forwards;

}

@keyframes fadeLogo{

0%{

opacity:0;
transform:scale(.85);

}

100%{

opacity:1;
transform:scale(1);

}

}

.steam{

position:absolute;
left:50%;
top:-35px;
transform:translateX(-50%);
width:18px;
height:70px;

}

.steam span{

position:absolute;
bottom:0;
width:6px;
height:30px;

background:rgba(255,255,255,.28);

border-radius:50px;

filter:blur(6px);

animation:steam 3s infinite;

}

.steam span:nth-child(2){

left:10px;
animation-delay:.7s;

}

.steam span:nth-child(3){

left:-10px;
animation-delay:1.3s;

}

@keyframes steam{

0%{

opacity:0;
transform:translateY(0) scale(1);

}

50%{

opacity:.8;

}

100%{

opacity:0;
transform:translateY(-55px) scale(1.6);

}

}

.loaderText{

margin-top:45px;

font-size:20px;
font-weight:600;
letter-spacing:6px;
color:white;

animation:pulse 2s infinite;

}

.loaderTag{

margin-top:10px;

font-size:14px;
letter-spacing:4px;
color:#c99537;

}

@keyframes pulse{

50%{

opacity:.5;

}

}

/* HERO */

.hero{

min-height:100vh;

display:flex;
align-items:center;
justify-content:center;

text-align:center;

padding:40px;

position:relative;

overflow:hidden;

}

.hero::before{

content:"";

position:absolute;

width:700px;
height:700px;

background:radial-gradient(circle,
rgba(201,149,55,.20),
transparent 70%);

filter:blur(70px);

animation:rotateGlow 18s linear infinite;

}

@keyframes rotateGlow{

100%{

transform:rotate(360deg);

}

}

.heroContent{

position:relative;
z-index:2;
max-width:900px;

}

.heroLogo{

width:170px;

margin-bottom:40px;

filter:

drop-shadow(0 0 15px rgba(201,149,55,.30))
drop-shadow(0 0 45px rgba(201,149,55,.20));

}

.hero h1{

font-size:72px;
font-weight:800;
line-height:1.1;

}

.gold{

color:#c99537;

}

.hero p{

margin-top:30px;

font-size:22px;

color:#d9d9d9;

line-height:1.7;

}

.cta{

display:inline-block;

margin-top:55px;

padding:18px 45px;

background:#c99537;

color:black;

font-weight:700;

text-decoration:none;

border-radius:50px;

transition:.35s;

}

.cta:hover{

transform:translateY(-6px);

box-shadow:

0 15px 40px rgba(201,149,55,.35);

}

/* Scroll Down */

.scroll{

position:absolute;

bottom:35px;
left:50%;

transform:translateX(-50%);

font-size:14px;

letter-spacing:5px;

color:#aaa;

animation:float 2s infinite;

}

@keyframes float{

50%{

transform:
translateX(-50%)
translateY(8px);

}

}

</style>

</head>

<body>

<!-- LOADER -->

<div id="loader">

<div class="logoBox">

<div class="steam">

<span></span>
<span></span>
<span></span>

</div>

<img src="logo.png" class="logo">

</div>

<div class="loaderText">

BREWON

</div>

<div class="loaderTag">

BREWING IDEAS. BREWING BRANDS.

</div>

</div>

<!-- HERO -->

<section class="hero">

<div class="heroContent">

<img src="logo.png" class="heroLogo">

<h1>

Brewing
<span class="gold">Ideas.</span><br>

Brewing
<span class="gold">Brands.</span>

</h1>

<p>

We transform businesses into premium brands through
creative storytelling, social media strategy,
high-converting content and unforgettable digital experiences.

</p>

<a href="#about" class="cta">

Explore BrewOn

</a>

</div>

<div class="scroll">

SCROLL

</div>

</section>

<script>

window.onload=function(){

setTimeout(function(){

document.getElementById("loader").style.opacity="0";

setTimeout(function(){

document.getElementById("loader").style.display="none";

},1000);

},3000);

}

</script>

</body>
</html>
